name: docs

# Builds the cdk8s Ruby API reference. Publishes nothing: the artifact is the
# output, and syncing it anywhere is the site's business.
#
# The point of interest is how naming reaches the documentation. cdk8s publishes
# no Ruby, so its assembly carries no `targets.ruby`; the generators are handed
# this repository's profile alongside the *unmodified* published assembly and
# merge the two in memory. Nothing repacks an assembly, so nothing ships a
# second artifact claiming to be cdk8s 2.70.91.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: publish the built documentation to the site
        type: boolean
        default: false
      packages:
        description: |
          What to document: "cdk8s", "plus" (all eight cdk8s-plus), or a JSON array.
        default: cdk8s

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.pick.outputs.packages }}
    steps:
      - id: pick
        run: |
          case "${{ inputs.packages }}" in
            plus)
              # Single-quoted so the JSON's quotes survive the shell.
              echo 'packages=["cdk8s-plus-25","cdk8s-plus-26","cdk8s-plus-27","cdk8s-plus-28","cdk8s-plus-29","cdk8s-plus-30","cdk8s-plus-31","cdk8s-plus-32"]' >> "$GITHUB_OUTPUT" ;;
            ""|cdk8s)
              echo 'packages=["cdk8s"]' >> "$GITHUB_OUTPUT" ;;
            *)
              echo 'packages=${{ inputs.packages }}' >> "$GITHUB_OUTPUT" ;;
          esac
          echo "will document: $(grep '^packages=' "$GITHUB_OUTPUT" | tail -1)"

  docs:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.publish && 'production' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout the Ruby target
        uses: actions/checkout@v4
        with:
          repository: omarqureshi/jsii-target-ruby
          ref: main
          path: plugin

      - name: Checkout the documentation site
        uses: actions/checkout@v4
        with:
          repository: omarqureshi/rubygems.omarqureshi.net
          ref: main
          path: site

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Bootstrap toolchain
        uses: omarqureshi/jsii-target-ruby/.github/actions/bootstrap-toolchain@main
        with:
          plugin-path: plugin

      - name: Install YARD + redcarpet + rouge
        run: gem install yard redcarpet rouge --no-document

      - name: Install cdk8s
        run: |
          mkdir -p work && cd work
          npm init -y > /dev/null
          # cdk8s-plus pins a compatible cdk8s as a peer, so installing the
          # plus package alone gets the right pair. Documenting cdk8s itself
          # installs it directly.
          npm install --save "${{ matrix.package }}"

      - name: Generate the Ruby bindings
        env:
          JSII_RUBY_TARGET_CONFIG: ${{ github.workspace }}/config/profile.json
        run: |
          cd work
          node "${GITHUB_WORKSPACE}/toolchain/jsii/packages/jsii-pacmak/bin/jsii-pacmak" \
            --plugin "${GITHUB_WORKSPACE}/plugin" \
            -t ruby --code-only --force-target --recurse \
            -o dist node_modules/${{ matrix.package }}

      - name: Extract the published assembly, unmodified
        # Straight out of the npm package. It carries no Ruby naming, and is not
        # rewritten to add any.
        run: |
          node -e "
            const fs = require('fs'), zlib = require('zlib');
            const dir = 'work/node_modules/${{ matrix.package }}';
            let a = JSON.parse(fs.readFileSync(dir + '/.jsii'));
            if (a.schema === 'jsii/file-redirect') {
              a = JSON.parse(zlib.gunzipSync(fs.readFileSync(dir + '/' + a.filename)));
            }
            fs.writeFileSync('work/assembly.jsii', JSON.stringify(a));
            console.log('targets in the published assembly:', Object.keys(a.targets).join(', '));
            if (a.targets.ruby) { throw new Error('expected no ruby naming in the published assembly'); }
          "

      - name: Build the documentation
        run: |
          OUT="${RUNNER_TEMP}/docs"
          mkdir -p "$OUT"

          # Put the dependencies' sources in the same YARD registry, so
          # references into them resolve as types and methods rather than
          # staying text. The plugin then rewrites the addresses to their
          # published pages, so the trees stay independently versioned.
          #
          # Absolute paths: yard runs from inside the library directory, and a
          # relative path there resolves to nothing and links nothing.
          libs=""; pairs=""
          for dep in cdk8s constructs; do
            [ "$dep" = "${{ matrix.package }}" ] && continue
            dir="$PWD/work/dist/ruby/lib/$dep"
            [ -d "$dir" ] || continue
            mod=$(node -p "require('./config/profile.json')['$dep'].module")
            ver=$(node -p "require('$PWD/work/node_modules/$dep/package.json').version")
            libs="$libs $dir"
            pairs="${pairs:+$pairs,}$mod=$ver"
          done
          export CROSSLINK_LIBS="$libs" YARD_CROSSLINK="$pairs"

          bash site/docs-gen/build-module-docs.sh "work/dist/ruby/lib/${{ matrix.package }}" "$OUT"
          # The profile is the third argument: naming comes from here, structure
          # from the assembly.
          ruby site/docs-gen/gen-module-landing.rb work/assembly.jsii "$OUT" config/profile.json
          ruby site/docs-gen/inject-crumb.rb "$OUT"
          # Statics read as constants, so the reference must display them that way.
          ruby plugin/docs-gen/constantize-static-reads.rb "$OUT"
          ruby site/docs-gen/gen-index.rb work/assembly.jsii "$OUT" config/profile.json
          echo "DOCS_OUT=$OUT" >> "$GITHUB_ENV"

      - name: The docs are under the profile's module name
        # If the profile did not reach the generators, the tree would be named
        # from a generic derivation (Cdk8s) instead.
        run: |
          # From the profile, so this checks the naming actually reached the
          # generators rather than restating a constant.
          MODULE=$(node -p "require('./config/profile.json')['${{ matrix.package }}'].module")
          test -d "$DOCS_OUT/$MODULE" \
            || { echo "::error::no $MODULE/ in the built tree"; ls "$DOCS_OUT"; exit 1; }
          echo "built $(find "$DOCS_OUT/$MODULE" -name '*.html' | wc -l) pages under $MODULE/"
          echo "DOCS_MODULE=$MODULE" >> "$GITHUB_ENV"

      - name: Upload the site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdk8s-ruby-docs-${{ matrix.package }}
          path: ${{ runner.temp }}/docs
          if-no-files-found: warn

      - name: Configure AWS credentials
        if: inputs.publish
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsCDKRole
          aws-region: us-east-1

      - name: Link references to the libraries this one depends on
        # YARD links a type only if it was in the registry when the page
        # rendered, and each library renders alone — so a cdk8s-plus page names
        # CDK8s::APIObjectMetadata twenty times and links it never.
        #
        # The versions come from what npm actually resolved, and the linkable
        # types from what is published, so a link is only ever written to a page
        # that exists.
        if: inputs.publish
        env:
          BUCKET: aws-cdk-ruby-gems
        run: |
          pairs=""
          for dep in cdk8s constructs; do
            [ -d "work/node_modules/$dep" ] || continue
            [ "$dep" = "${{ matrix.package }}" ] && continue
            mod=$(node -p "require('./config/profile.json')['$dep'].module")
            ver=$(node -p "require('$PWD/work/node_modules/$dep/package.json').version")
            pairs="$pairs $mod=$ver"
          done
          if [ -z "$pairs" ]; then
            echo "nothing to link against"
          else
            ruby site/docs-gen/crosslink-tree.rb "$DOCS_OUT" "$BUCKET" $pairs
          fi

      - name: Publish to this version's own prefix
        if: inputs.publish
        env:
          BUCKET: aws-cdk-ruby-gems
        run: |
          # The same contract every publisher follows: write only under
          # docs/<Library>/<version>/, never --delete (the destination is shared
          # with every other library), and leave the bare alias to the
          # repository that owns the shared paths.
          VERSION=$(node -p "require('$PWD/work/node_modules/${{ matrix.package }}/package.json').version")
          DEST="s3://$BUCKET/docs/$DOCS_MODULE/$VERSION/"
          echo "publishing $DOCS_MODULE $VERSION -> $DEST"
          aws s3 sync "$DOCS_OUT" "$DEST" --no-progress
          echo "published $(aws s3 ls "$DEST" --recursive | wc -l) objects"
          echo "DOCS_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Ask the site to refresh its aliases and caches
        if: inputs.publish
        env:
          # Cross-repository dispatch needs a token with access to the site;
          # the default GITHUB_TOKEN is scoped to this repository and cannot do
          # it. Without SITE_DISPATCH_TOKEN the site picks the change up on its
          # own schedule, so publishing still completes — just not instantly.
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::no SITE_DISPATCH_TOKEN; the site will refresh on its schedule"
            exit 0
          fi
          gh api -X POST repos/omarqureshi/rubygems.omarqureshi.net/dispatches \
            -f event_type=docs-published \
            -f client_payload[library]="$DOCS_MODULE" \
            -f client_payload[version]="$DOCS_VERSION" \
            && echo "notified the site repository" \
            || echo "::warning::could not notify the site; run its refresh workflow by hand"
