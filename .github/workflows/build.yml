name: build

# Generates the cdk8s Ruby bindings and proves they behave like the originals,
# by synthesizing the same chart from Ruby and from TypeScript and diffing the
# manifests. Nothing is published.
#
# cdk8s is worth checking this way and aws-cdk-lib is not, cheaply: a cdk8s app
# writes YAML and needs no cloud account, so "do these bindings mean the same
# thing" is a diff rather than an argument.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      cdk8s-version:
        description: cdk8s version to build against
        default: latest
      cdk8s-plus-version:
        description: cdk8s-plus package to build against
        default: cdk8s-plus-27

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout the Ruby target
        uses: actions/checkout@v4
        with:
          repository: omarqureshi/jsii-target-ruby
          ref: main
          path: plugin

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Bootstrap toolchain
        uses: omarqureshi/jsii-target-ruby/.github/actions/bootstrap-toolchain@main
        with:
          plugin-path: plugin
          # The conformance check runs the generated bindings, so it needs a
          # kernel, not just a generator.
          install-runtime: 'true'

      - name: Install cdk8s
        # cdk8s-plus pins a compatible cdk8s range as a peer dependency, so let
        # it choose rather than forcing `cdk8s@latest` past it — two copies of
        # cdk8s in one kernel is a confusing failure a long way from here.
        run: |
          mkdir -p work && cd work
          npm init -y > /dev/null
          npm install --save "${{ inputs.cdk8s-plus-version || 'cdk8s-plus-27' }}"
          echo "resolved:"
          node -e "
            for (const p of ['cdk8s', 'cdk8s-plus-27', 'constructs']) {
              console.log('  ' + p + ' ' + require(p + '/package.json').version);
            }
          "
          echo "copies of cdk8s in the tree: \$(find node_modules -name package.json -path '*/cdk8s/*' -maxdepth 4 | wc -l)"

      - name: Check the naming profile
        run: |
          mkdir -p node_modules && ln -sfn "$PWD/plugin" node_modules/jsii-target-ruby
          CDK8S="$PWD/work/node_modules/cdk8s" node --test test/*.test.js

      - name: Conformance — synthesize from Ruby and TypeScript, and diff
        env:
          # Locally the plugin is a sibling clone and pacmak sits beside it;
          # in CI both are checked out into the workspace, so say where.
          PLUGIN_PATH: ${{ github.workspace }}/plugin
          PACMAK: ${{ github.workspace }}/toolchain/jsii/packages/jsii-pacmak/bin/jsii-pacmak
        run: ./conformance.sh "${RUNNER_TEMP}/conformance" "$PWD/work/node_modules"

      - name: Upload the bindings
        uses: actions/upload-artifact@v4
        with:
          name: cdk8s-ruby-bindings
          path: ${{ runner.temp }}/conformance/gen
          if-no-files-found: error
